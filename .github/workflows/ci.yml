name: Check and Publish

on:
  push:
    branches: ['**']
    tags: ['*-v*']
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: install
        run: bun install --frozen-lockfile

      # - name: audit
      #   run: bun audit

      - name: format
        run: bun format:check

      - name: lint
        run: bun lint

      - name: test
        run: bun test:extensions && bun test:web

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: install
        run: bun install --frozen-lockfile

      - name: resolve tag
        run: |
          APP="${GITHUB_REF_NAME%-v*}"
          VERSION="${GITHUB_REF_NAME##*-v}"
          test -d "apps/$APP" || { echo "apps/$APP not found"; exit 1; }
          echo "app=$APP" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: create github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: "${{ env.app }} v${{ env.version }}"

      - name: publish
        working-directory: apps/${{ env.app }}
        run: npm publish
