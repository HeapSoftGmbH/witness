name: CI

on:
  push:
    tags-ignore: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: install
        run: bun install --frozen-lockfile

      - name: audit
        run: bun audit

      - name: format
        run: bun format:check

      - name: lint
        run: bun lint

      - name: test
        run: bun test packages/witness apps/witness-pi

  release:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: setup node (npm auth)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          registry-url: https://registry.npmjs.org

      - name: install
        run: bun install --frozen-lockfile

      - name: next version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8
        with:
          token: ${{ github.token }}
          branch: main
          noVersionBumpBehavior: patch

      - name: tag release
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          git tag v$VERSION
          git push origin v$VERSION

      - name: set package version
        working-directory: apps/witness-pi
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: npm pkg set version=$VERSION

      - name: publish
        working-directory: apps/witness-pi
        run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
