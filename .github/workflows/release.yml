name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: install
        run: bun install --frozen-lockfile

      - name: audit
        run: bun audit

      - name: prettier
        run: bun format:check

      - name: lint
        run: bun lint

      - name: test
        run: bun test packages/witness apps/witness-pi

      - name: publish to npm
        working-directory: apps/witness-pi
        run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
